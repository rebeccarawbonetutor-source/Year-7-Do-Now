<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do Now Grid</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --accent-color: #3498db;
            --lesson-color: #e67e22;
            --term-color: #9b59b6;
            --year-color: #2ecc71;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        label {
            font-weight: 600;
        }

        select, button {
            font-size: 1rem;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            background: #edf2f7;
            padding: 5px 15px;
            border-radius: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin-top: 10px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 25px;
            display: flex;
            flex-direction: column;
            min-height: 250px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            border-top: 8px solid var(--accent-color);
            user-select: none;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .card.last-lesson { border-top-color: var(--lesson-color); }
        .card.last-term { border-top-color: var(--term-color); }
        .card.last-year { border-top-color: var(--year-color); }

        .card-tag {
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #718096;
        }

        .card.last-lesson .card-tag { color: var(--lesson-color); }
        .card.last-term .card-tag { color: var(--term-color); }
        .card.last-year .card-tag { color: var(--year-color); }

        .question {
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .answer-box {
            background: #f7fafc;
            border: 2px dashed #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 500;
            color: #4a5568;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        .card.revealed .answer-box {
            background: #f0fff4;
            border-color: #9ae6b4;
            color: #22543d;
            border-style: solid;
        }

        .click-hint {
            font-size: 0.8rem;
            color: #a0aec0;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Do Now</h1>

    <div class="controls">
        <label for="current-lesson">Current Lesson:</label>
        <select id="current-lesson" onchange="rollQuestions()">
            <option value="7-1-1">7-1-1</option>
            <option value="7-1-2">7-1-2</option>
            <option value="7-1-3">7-1-3</option>
            <option value="7-1-4">7-1-4</option>
            <option value="7-1-5" selected>7-1-5</option>
            <option value="7-1-6">7-1-6</option>
        </select>

        <button onclick="rollQuestions()">Roll Questions</button>

        <div class="timer-container">
            ⏱️ <span id="timer-display">05:00</span>
            <button id="timer-btn" onclick="toggleTimer()">Start</button>
            <button onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <div class="grid">
        <!-- Box 1 -->
        <div class="card last-lesson" onclick="toggleReveal(this, 'b1')">
            <div class="card-tag" id="tag-box1">Last Lesson</div>
            <div class="question" id="q-box1">Loading...</div>
            <div class="answer-box" id="a-box1">???</div>
            <div class="click-hint">Click box to reveal answer</div>
        </div>

        <!-- Box 2 -->
        <div class="card last-term" onclick="toggleReveal(this, 'b2')">
            <div class="card-tag" id="tag-box2">Last Term</div>
            <div class="question" id="q-box2">Loading...</div>
            <div class="answer-box" id="a-box2">???</div>
            <div class="click-hint">Click box to reveal answer</div>
        </div>

        <!-- Box 3 -->
        <div class="card last-year" onclick="toggleReveal(this, 'b3')">
            <div class="card-tag">Year 6 Recap</div>
            <div class="question" id="q-box3">Loading...</div>
            <div class="answer-box" id="a-box3">???</div>
            <div class="click-hint">Click box to reveal answer</div>
        </div>
    </div>
