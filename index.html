<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Do Now Grid</title><style>:root {--bg-color: #f4f6f9;--card-bg: #ffffff;--text-color: #2c3e50;--accent-color: #3498db;--lesson-color: #e67e22;--term-color: #9b59b6;--year-color: #2ecc71;--border-radius: 12px;}body {font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;background-color: var(--bg-color);color: var(--text-color);margin: 0;padding: 20px;display: flex;flex-direction: column;align-items: center;min-height: 100vh;}h1 {font-size: 2.5rem;margin-bottom: 10px;text-align: center;}.controls {display: flex;gap: 15px;margin-bottom: 25px;flex-wrap: wrap;justify-content: center;align-items: center;background: var(--card-bg);padding: 15px 25px;border-radius: var(--border-radius);box-shadow: 0 4px 6px rgba(0,0,0,0.05);}label {font-weight: 600;}select, button {font-size: 1rem;padding: 8px 16px;border-radius: 6px;border: 1px solid #ccc;background: white;cursor: pointer;}button {background-color: var(--accent-color);color: white;border: none;font-weight: bold;transition: background 0.2s;}button:hover {background-color: #2980b9;}.timer-container {display: flex;align-items: center;gap: 10px;font-size: 1.5rem;font-weight: bold;background: #edf2f7;padding: 5px 15px;border-radius: 8px;}.grid {display: grid;grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));gap: 20px;width: 100%;max-width: 1200px;margin-top: 10px;}.card {background: var(--card-bg);border-radius: var(--border-radius);box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);padding: 25px;display: flex;flex-direction: column;min-height: 250px;cursor: pointer;position: relative;transition: transform 0.2s, box-shadow 0.2s;border-top: 8px solid var(--accent-color);user-select: none;}.card:hover {transform: translateY(-5px);box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);}.card.last-lesson { border-top-color: var(--lesson-color); }.card.last-term { border-top-color: var(--term-color); }.card.last-year { border-top-color: var(--year-color); }.card-tag {font-size: 0.9rem;text-transform: uppercase;font-weight: bold;letter-spacing: 1px;margin-bottom: 15px;color: #718096;}.card.last-lesson .card-tag { color: var(--lesson-color); }.card.last-term .card-tag { color: var(--term-color); }.card.last-year .card-tag { color: var(--year-color); }.question {font-size: 1.4rem;font-weight: 600;line-height: 1.4;margin-bottom: 20px;flex-grow: 1;}.answer-box {background: #f7fafc;border: 2px dashed #e2e8f0;border-radius: 8px;padding: 15px;font-size: 1.2rem;font-weight: 500;color: #4a5568;text-align: center;display: flex;align-items: center;justify-content: center;min-height: 60px;}.card.revealed .answer-box {background: #f0fff4;border-color: #9ae6b4;color: #22543d;border-style: solid;}.click-hint {font-size: 0.8rem;color: #a0aec0;text-align: center;margin-top: 10px;}</style></head><body><h1>Do Now</h1><div class="controls"><label for="current-lesson">Current Lesson:</label><select id="current-lesson" onchange="rollQuestions()"><option value="7-1-1">7-1-1</option><option value="7-1-2">7-1-2</option><option value="7-1-3">7-1-3</option><option value="7-1-4">7-1-4</option><option value="7-1-5" selected>7-1-5</option><option value="7-1-6">7-1-6</option></select><button onclick="rollQuestions()">Roll Questions</button><div class="timer-container">⏱️ <span id="timer-display">05:00</span><button id="timer-btn" onclick="toggleTimer()">Start</button><button onclick="resetTimer()">Reset</button></div></div><div class="grid"><!-- Box 1 --><div class="card last-lesson" onclick="toggleReveal(this, 'b1')"><div class="card-tag" id="tag-box1">Last Lesson</div><div class="question" id="q-box1">Loading...</div><div class="answer-box" id="a-box1">???</div><div class="click-hint">Click box to reveal answer</div></div><!-- Box 2 --><div class="card last-term" onclick="toggleReveal(this, 'b2')"><div class="card-tag" id="tag-box2">Last Term</div><div class="question" id="q-box2">Loading...</div><div class="answer-box" id="a-box2">???</div><div class="click-hint">Click box to reveal answer</div></div><!-- Box 3 --><div class="card last-year" onclick="toggleReveal(this, 'b3')"><div class="card-tag">Year 6 Recap</div><div class="question" id="q-box3">Loading...</div><div class="answer-box" id="a-box3">???</div><div class="click-hint">Click box to reveal answer</div></div></div><script>const lessonSequence = ["7-1-1", "7-1-2", "7-1-3", "7-1-4", "7-1-5", "7-1-6"];const curriculum = {"7-1-1": [{ q: "What is the capital of the UK?", a: "London" },{ q: "What is 5 + 7?", a: "12" }],"7-1-2": [{ q: "Name a primary color.", a: "Red, Yellow, or Blue" },{ q: "What do trees produce that humans need to breathe?", a: "Oxygen" }],"7-1-3": [{ q: "How many days are in a leap year?", a: "366" },{ q: "What is the opposite of 'hot'?", a: "Cold" }],"7-1-4": [{ q: "What is the largest ocean on Earth?", a: "Pacific Ocean" },{ q: "What gas do humans exhale?", a: "Carbon Dioxide" }],"7-1-5": [{ q: "What shape has 5 sides?", a: "Pentagon" },{ q: "Which planet is closest to the Sun?", a: "Mercury" }],"7-1-6": [{ q: "What is the square root of 64?", a: "8" },{ q: "Who wrote 'Romeo and Juliet'?", a: "William Shakespeare" }],"Year 6": [{ q: "Who founded Buddhism?", a: "Siddhartha Gautama (the Buddha)." },{ q: "What is the key symbol of Buddhism?", a: "The Eight-Spoked Wheel." },{ q: "What do Buddhists call the state of perfect peace?", a: "Nirvana." },{ q: "Where do Buddhists go to worship?", a: "A Temple, Vihara, or Stupa." },{ q: "What is the key teaching about why life involves suffering?", a: "The Four Noble Truths." }]};let currentAnswers = { b1: "", b2: "", b3: "" };let timerInterval = null;let timeRemaining = 300;function getRandomElement(arr) {if (!arr || arr.length === 0) return { q: "No questions available", a: "N/A" };return arr[Math.floor(Math.random() * arr.length)];}function rollQuestions() {const currentLesson = document.getElementById("current-lesson").value;const currentIndex = lessonSequence.indexOf(currentLesson);let lastLessonPool = [];let lastTermPool = [];let year6Pool = curriculum["Year 6"] || [];if (currentIndex > 0) {const lastLessonKey = lessonSequence[currentIndex - 1];lastLessonPool = curriculum[lastLessonKey] || [];document.getElementById("tag-box1").innerText = Last Lesson (${lastLessonKey});} else {document.getElementById("tag-box1").innerText = "Last Lesson";}for (let i = 0; i < currentIndex - 1; i++) {const lessonKey = lessonSequence[i];if (curriculum[lessonKey]) {lastTermPool = lastTermPool.concat(curriculum[lessonKey]);}}const item1 = getRandomElement(lastLessonPool.length > 0 ? lastLessonPool : year6Pool);const item2 = getRandomElement(lastTermPool.length > 0 ? lastTermPool : year6Pool);const item3 = getRandomElement(year6Pool);document.getElementById("q-box1").innerText = item1.q;document.getElementById("q-box2").innerText = item2.q;document.getElementById("q-box3").innerText = item3.q;currentAnswers.b1 = item1.a;currentAnswers.b2 = item2.a;currentAnswers.b3 = item3.a;document.querySelectorAll('.card').forEach(card => {card.classList.remove('revealed');});document.getElementById("a-box1").innerText = "???";document.getElementById("a-box2").innerText = "???";document.getElementById("a-box3").innerText = "???";}function toggleReveal(cardElement, boxKey) {if (!cardElement.classList.contains('revealed')) {cardElement.classList.add('revealed');document.getElementById(a-${boxKey}).innerText = currentAnswers[boxKey];} else {cardElement.classList.remove('revealed');document.getElementById(a-${boxKey}).innerText = "???";}}function updateTimerDisplay() {const minutes = Math.floor(timeRemaining / 60).toString().padStart(2, '0');const seconds = (timeRemaining % 60).toString().padStart(2, '0');document.getElementById("timer-display").innerText = ${minutes}:${seconds};}function toggleTimer() {const btn = document.getElementById("timer-btn");if (timerInterval) {clearInterval(timerInterval);timerInterval = null;btn.innerText = "Start";} else {btn.innerText = "Pause";timerInterval = setInterval(() => {if (timeRemaining > 0) {timeRemaining--;updateTimerDisplay();} else {clearInterval(timerInterval);timerInterval = null;btn.innerText = "Start";alert("Time is up!");}}, 1000);}}function resetTimer() {clearInterval(timerInterval);timerInterval = null;timeRemaining = 300;updateTimerDisplay();document.getElementById("timer-btn").innerText = "Start";}window.onload = function() {rollQuestions();};</script></body></html>
